<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Virtual Closet - API 테스트</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }
        
        .container {
            max-width: 1200px;
            margin: 0 auto;
        }
        
        .header {
            background: white;
            padding: 30px;
            border-radius: 15px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.2);
            margin-bottom: 30px;
            text-align: center;
        }
        
        h1 {
            color: #667eea;
            font-size: 2.5em;
            margin-bottom: 10px;
        }
        
        .subtitle {
            color: #666;
            font-size: 1.2em;
        }
        
        .status {
            display: inline-block;
            padding: 8px 20px;
            background: #10b981;
            color: white;
            border-radius: 20px;
            font-weight: bold;
            margin-top: 15px;
        }
        
        .section {
            background: white;
            padding: 25px;
            border-radius: 15px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.2);
            margin-bottom: 20px;
        }
        
        h2 {
            color: #667eea;
            margin-bottom: 20px;
            font-size: 1.8em;
        }
        
        .items-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 20px;
        }
        
        .item-card {
            background: linear-gradient(135deg, #f5f7fa 0%, #c3cfe2 100%);
            padding: 20px;
            border-radius: 12px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
            transition: transform 0.2s;
        }
        
        .item-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 8px 12px rgba(0,0,0,0.15);
        }
        
        .item-name {
            font-size: 1.3em;
            font-weight: bold;
            color: #333;
            margin-bottom: 10px;
        }
        
        .item-detail {
            display: flex;
            justify-content: space-between;
            margin: 8px 0;
            color: #666;
        }
        
        .item-detail strong {
            color: #333;
        }
        
        .item-price {
            font-size: 1.4em;
            color: #667eea;
            font-weight: bold;
            margin-top: 15px;
            padding-top: 15px;
            border-top: 2px solid rgba(102, 126, 234, 0.2);
        }
        
        .item-tags {
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
            margin-top: 12px;
        }
        
        .tag {
            background: #667eea;
            color: white;
            padding: 5px 12px;
            border-radius: 15px;
            font-size: 0.85em;
        }
        
        .add-form {
            display: grid;
            gap: 15px;
            margin-bottom: 25px;
        }
        
        input, select, button {
            padding: 12px;
            border: 2px solid #e5e7eb;
            border-radius: 8px;
            font-size: 1em;
            font-family: inherit;
        }
        
        input:focus, select:focus {
            outline: none;
            border-color: #667eea;
        }
        
        button {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            cursor: pointer;
            font-weight: bold;
            transition: transform 0.2s;
        }
        
        button:hover {
            transform: scale(1.02);
        }
        
        button:active {
            transform: scale(0.98);
        }
        
        .stats {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 15px;
            margin-top: 20px;
        }
        
        .stat-card {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 20px;
            border-radius: 12px;
            text-align: center;
        }
        
        .stat-number {
            font-size: 2.5em;
            font-weight: bold;
            margin-bottom: 5px;
        }
        
        .stat-label {
            font-size: 1em;
            opacity: 0.9;
        }
        
        .loading {
            text-align: center;
            padding: 40px;
            color: #667eea;
            font-size: 1.2em;
        }
        
        .error {
            background: #fee;
            color: #c33;
            padding: 15px;
            border-radius: 8px;
            margin: 15px 0;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>👕 Virtual Closet</h1>
            <p class="subtitle">가상 옷장 관리 앱 - API 데모</p>
            <div class="status" id="status">● 서버 상태 확인 중...</div>
        </div>
        
        <div class="section">
            <h2>📊 통계</h2>
            <div class="stats">
                <div class="stat-card">
                    <div class="stat-number" id="totalItems">0</div>
                    <div class="stat-label">총 아이템</div>
                </div>
                <div class="stat-card">
                    <div class="stat-number" id="totalValue">0원</div>
                    <div class="stat-label">총 가치</div>
                </div>
                <div class="stat-card">
                    <div class="stat-number" id="categories">0</div>
                    <div class="stat-label">카테고리</div>
                </div>
            </div>
        </div>
        
        <div class="section">
            <h2>➕ 새 아이템 추가</h2>
            <div class="add-form">
                <input type="text" id="name" placeholder="아이템 이름 (예: 화이트 셔츠)" required>
                <select id="category" required>
                    <option value="">카테고리 선택</option>
                    <option value="TOP">상의 (TOP)</option>
                    <option value="BOTTOM">하의 (BOTTOM)</option>
                    <option value="OUTER">아우터 (OUTER)</option>
                    <option value="DRESS">원피스 (DRESS)</option>
                    <option value="SHOES">신발 (SHOES)</option>
                    <option value="BAG">가방 (BAG)</option>
                    <option value="ACCESSORY">악세서리 (ACCESSORY)</option>
                </select>
                <input type="text" id="brand" placeholder="브랜드 (예: Uniqlo)">
                <input type="text" id="size" placeholder="사이즈 (예: M, L, 95)">
                <input type="text" id="color" placeholder="색상 (예: White, Black)">
                <input type="number" id="price" placeholder="가격 (예: 29000)">
                <button onclick="addItem()">🎉 아이템 추가하기</button>
            </div>
        </div>
        
        <div class="section">
            <h2>🗂️ 내 옷장 (<span id="itemCount">0</span>개)</h2>
            <div id="itemsList" class="loading">아이템을 불러오는 중...</div>
        </div>
    </div>

    <script>
        const API_URL = 'https://4000-ie9wpiu3cp58a236iuzwi-82b888ba.sandbox.novita.ai/graphql';
        
        // 서버 상태 확인
        async function checkHealth() {
            try {
                const response = await fetch('https://4000-ie9wpiu3cp58a236iuzwi-82b888ba.sandbox.novita.ai/health');
                const data = await response.json();
                document.getElementById('status').textContent = '● 서버 정상 작동 중';
                document.getElementById('status').style.background = '#10b981';
            } catch (error) {
                document.getElementById('status').textContent = '● 서버 연결 실패';
                document.getElementById('status').style.background = '#ef4444';
            }
        }
        
        // GraphQL 쿼리 실행
        async function graphqlQuery(query) {
            const response = await fetch(API_URL, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ query })
            });
            const result = await response.json();
            return result.data;
        }
        
        // 아이템 목록 불러오기
        async function loadItems() {
            try {
                const data = await graphqlQuery(`
                    query {
                        items {
                            items {
                                id
                                name
                                category
                                brand
                                size
                                color
                                price
                                tags
                            }
                            total
                        }
                    }
                `);
                
                const items = data.items.items;
                const total = data.items.total;
                
                // 통계 업데이트
                document.getElementById('totalItems').textContent = total;
                document.getElementById('itemCount').textContent = total;
                
                const totalValue = items.reduce((sum, item) => sum + (item.price || 0), 0);
                document.getElementById('totalValue').textContent = totalValue.toLocaleString() + '원';
                
                const uniqueCategories = new Set(items.map(item => item.category));
                document.getElementById('categories').textContent = uniqueCategories.size;
                
                // 아이템 카드 렌더링
                const itemsList = document.getElementById('itemsList');
                if (items.length === 0) {
                    itemsList.innerHTML = '<p class="loading">아직 아이템이 없습니다. 위에서 추가해보세요!</p>';
                    return;
                }
                
                itemsList.className = 'items-grid';
                itemsList.innerHTML = items.map(item => `
                    <div class="item-card">
                        <div class="item-name">${item.name}</div>
                        <div class="item-detail">
                            <span>카테고리:</span>
                            <strong>${item.category}</strong>
                        </div>
                        ${item.brand ? `
                        <div class="item-detail">
                            <span>브랜드:</span>
                            <strong>${item.brand}</strong>
                        </div>` : ''}
                        ${item.size ? `
                        <div class="item-detail">
                            <span>사이즈:</span>
                            <strong>${item.size}</strong>
                        </div>` : ''}
                        ${item.color ? `
                        <div class="item-detail">
                            <span>색상:</span>
                            <strong>${item.color}</strong>
                        </div>` : ''}
                        ${item.price ? `
                        <div class="item-price">${item.price.toLocaleString()}원</div>` : ''}
                        ${item.tags && item.tags.length > 0 ? `
                        <div class="item-tags">
                            ${item.tags.map(tag => `<span class="tag">#${tag}</span>`).join('')}
                        </div>` : ''}
                    </div>
                `).join('');
                
            } catch (error) {
                console.error('Error loading items:', error);
                document.getElementById('itemsList').innerHTML = 
                    '<div class="error">아이템을 불러오는데 실패했습니다: ' + error.message + '</div>';
            }
        }
        
        // 아이템 추가
        async function addItem() {
            const name = document.getElementById('name').value;
            const category = document.getElementById('category').value;
            const brand = document.getElementById('brand').value;
            const size = document.getElementById('size').value;
            const color = document.getElementById('color').value;
            const price = document.getElementById('price').value;
            
            if (!name || !category) {
                alert('이름과 카테고리는 필수입니다!');
                return;
            }
            
            try {
                const mutation = `
                    mutation {
                        createItem(input: {
                            name: "${name}"
                            category: "${category}"
                            ${brand ? `brand: "${brand}"` : ''}
                            ${size ? `size: "${size}"` : ''}
                            ${color ? `color: "${color}"` : ''}
                            ${price ? `price: ${price}` : ''}
                            tags: ["new"]
                        }) {
                            id
                            name
                        }
                    }
                `;
                
                await graphqlQuery(mutation);
                
                // 폼 초기화
                document.getElementById('name').value = '';
                document.getElementById('category').value = '';
                document.getElementById('brand').value = '';
                document.getElementById('size').value = '';
                document.getElementById('color').value = '';
                document.getElementById('price').value = '';
                
                // 목록 새로고침
                await loadItems();
                
                alert('✅ 아이템이 추가되었습니다!');
            } catch (error) {
                alert('❌ 아이템 추가 실패: ' + error.message);
            }
        }
        
        // 초기 로드
        checkHealth();
        loadItems();
        
        // 5초마다 상태 확인
        setInterval(checkHealth, 5000);
    </script>
</body>
</html>
